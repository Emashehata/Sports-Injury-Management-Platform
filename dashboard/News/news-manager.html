<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>إدارة الأخبار - لوحة التحكم</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin-style.css">
    <link rel="stylesheet" href="../../css/toaster.css">
    <link rel="stylesheet" href="./news-manager.css">
    
</head>
<body>
    <div class="admin-layout">
        <div id="sidebar-container"></div>
        
        <main class="admin-main">
            <button class="sidebar-toggle-btn" id="sidebarToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            
            <div class="news-header">
                <div class="page-header" style="margin-bottom: 20px;">
                    <h2>
                        <i class="fa-solid fa-newspaper" style="color: var(--primary);"></i> 
                        إدارة الأخبار
                    </h2>
                    <div class="current-date" id="currentDate"></div>
                </div>
                
                <div class="actions-bar-news">
                    <div class="search-box-news">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="ابحث بالعنوان أو المحتوى...">
                    </div>
                    <button class="btn-add-news" id="openAddModalBtn">
                        <i class="fa-solid fa-plus"></i>
                        خبر جديد
                    </button>
                </div>
            </div>
            
            <div class="news-table-container">
                <table class="news-table">
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>العنوان</th>
                            <th>المحتوى</th>
                            <th>التاريخ</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="newsTableBody">
                        <tr>
                            <td colspan="5">
                                <div class="loading-spinner">
                                    <i class="fa-solid fa-spinner fa-pulse"></i>
                                    <p>جاري التحميل...</p>
                                </div>
                             </td>
                         </tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination" class="pagination-news"></div>
        </main>
    </div>
    
    <!-- Add/Edit Modal -->
    <div id="newsModal" class="modal-news">
        <div class="modal-news-content">
            <div class="modal-news-header">
                <h3 id="modalTitle">إضافة خبر جديد</h3>
                <button class="modal-news-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-news-body">
                <form id="newsForm">
                    <input type="hidden" id="newsId">
                    <div class="form-group-news">
                        <label>عنوان الخبر *</label>
                        <input type="text" id="title" required placeholder="أدخل عنوان الخبر">
                    </div>
                    <div class="form-group-news">
                        <label>صورة الخبر</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="imageFile" accept="image/*">
                        </div>
                        <img id="imagePreview" class="image-preview-news" alt="معاينة الصورة">
                    </div>
                    <div class="form-group-news">
                        <label>محتوى الخبر *</label>
                        <textarea id="content" required placeholder="أدخل محتوى الخبر..."></textarea>
                    </div>
                    <div class="form-group-news">
                        <label>تاريخ النشر *</label>
                        <input type="date" id="date" required>
                    </div>
                </form>
            </div>
            <div class="modal-news-footer">
                <button class="btn-cancel-news" onclick="closeModal()">إلغاء</button>
                <button class="btn-save-news" id="saveNewsBtn">حفظ</button>
            </div>
        </div>
    </div>
    
    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="delete-modal">
        <div class="delete-modal-content">
            <div class="delete-modal-header">
                <i class="fa-solid fa-trash-can"></i>
                <h3>تأكيد الحذف</h3>
            </div>
            <div class="delete-modal-body">
                <p>هل أنت متأكد من حذف هذا الخبر؟</p>
                <div class="delete-news-title" id="deleteNewsTitle"></div>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 16px;">لا يمكنك التراجع عن هذا الإجراء</p>
            </div>
            <div class="delete-modal-footer">
                <button class="btn-cancel-delete" onclick="closeDeleteModal()">إلغاء</button>
                <button class="btn-confirm-delete" id="confirmDeleteBtn">تأكيد الحذف</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="./news-manager.js"></script>
</body>
</html>
