<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كشف اللاعب</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../../css/style.css" />
    <link rel="stylesheet" href="../../../css/toaster.css" />
    <link rel="stylesheet" href="./doctor_examination.css" />
  </head>
  <body>
    <nav></nav>

    <section class="doctor-exam-section">
      <div class="container">
        <div class="exam-wrapper">
          <div class="exam-header">
            <div>
              <span class="exam-badge">بدء الكشف</span>
              <h1>كشف اللاعب</h1>
              <p>يمكنك مراجعة بيانات اللاعب والإصابات السابقة ثم إضافة إصابة جديدة.</p>
            </div>
          </div>

          <div id="accessMessage" class="access-message"></div>

          <div class="row g-4 align-items-start">
            <div class="col-lg-5">
              <div class="info-card">
                <h3 class="section-title">بيانات الموعد واللاعب</h3>

                <div class="info-list">
                  <div class="info-item">
                    <i class="fa-solid fa-user"></i>
                    <span>الاسم: <strong id="playerName">-</strong></span>
                  </div>

                  <div class="info-item">
                    <i class="fa-regular fa-envelope"></i>
                    <span>البريد: <strong id="playerEmail">-</strong></span>
                  </div>

                  <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>الهاتف: <strong id="playerPhone">-</strong></span>
                  </div>

                  <div class="info-item">
                    <i class="fa-regular fa-calendar"></i>
                    <span>التاريخ: <strong id="appointmentDate">-</strong></span>
                  </div>

                  <div class="info-item">
                    <i class="fa-regular fa-clock"></i>
                    <span>الوقت: <strong id="appointmentTime">-</strong></span>
                  </div>

                  <div class="info-item">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>الحالة: <strong id="appointmentStatus">-</strong></span>
                  </div>
                </div>
              </div>

              <div class="info-card mt-4 previous-injuries-card">
                <h3 class="section-title">الإصابات السابقة</h3>
                <div id="previousInjuriesContainer"></div>
              </div>
            </div>

            <div class="col-lg-7">
              <div class="form-card">
                <h3 class="section-title">إضافة إصابة جديدة</h3>

                <form id="injuryForm">
                  <div class="mb-3">
                    <label for="injuryType" class="form-label">نوع الإصابة</label>
                    <input
                      type="text"
                      id="injuryType"
                      class="form-control"
                      placeholder="مثال: Knee Ligament"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="diagnosis" class="form-label">التشخيص</label>
                    <textarea
                      id="diagnosis"
                      class="form-control"
                      rows="5"
                      placeholder="اكتب التشخيص"
                      required
                    ></textarea>
                  </div>

                  <div class="mb-3">
                    <label for="injuryDate" class="form-label">تاريخ الإصابة</label>
                    <input type="date" id="injuryDate" class="form-control" required />
                  </div>

                  <div class="form-actions">
                    <button type="button" class="action-btn cancel-btn" id="backBtn">
                      رجوع
                    </button>
                    <button type="submit" class="action-btn save-btn" id="saveBtn">
                      حفظ الإصابة
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../../shared/js/footer.js"></script>
    <script type="module" src="../../../shared/js/navbar.js"></script>
    <script type="module" src="../../../shared/js/toaster.js"></script>
    <script type="module" src="./doctor_examination.js"></script>
  </body>
</html>
