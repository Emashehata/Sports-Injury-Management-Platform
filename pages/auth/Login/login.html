<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../../css/style.css" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <nav></nav>

    <section class="auth-section">
      <div class="container">
        <div class="auth-wrapper">
          <div class="row g-0 align-items-stretch">
            <div class="col-lg-5">
              <div class="auth-side">
                <span class="auth-badge">مرحبًا بعودتك</span>
                <h1>سجّل الدخول إلى حسابك</h1>
                <p>
                  ادخل إلى حسابك للوصول السريع إلى خدمات المنصة والمتابعة بسهولة.
                </p>

                <div class="auth-side-info">
                  <div class="auth-info-item">
                    <i class="fa-solid fa-shield-heart"></i>
                    <span>دخول آمن</span>
                  </div>
                  <div class="auth-info-item">
                    <i class="fa-solid fa-bolt"></i>
                    <span>وصول سريع</span>
                  </div>
                </div>
                <a href="../../Home/home.html" class="back-home-btn">
  <i class="fa-solid fa-house"></i>
  العودة إلى الرئيسية
</a>
              </div>
            </div>

            <div class="col-lg-7">
              <div class="auth-form-box">
                <div class="auth-form-header">
                  <h2>تسجيل الدخول</h2>
                  <p>أدخل بيانات الحساب للمتابعة</p>
                </div>

                <form id="loginForm" class="auth-form" novalidate>
                  <div class="mb-3">
                    <label class="form-label" for="email">البريد الإلكتروني</label>
                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="fa-regular fa-envelope"></i>
                      </span>
                      <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="أدخل البريد الإلكتروني"
                        autocomplete="email"
                      />
                    </div>
                    <small class="field-error" id="emailError"></small>
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="password">كلمة المرور</label>
                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="fa-solid fa-lock"></i>
                      </span>
                      <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                      />
                      <button
                        type="button"
                        class="input-group-text password-toggle"
                        id="togglePassword"
                        aria-label="إظهار كلمة المرور"
                      >
                        <i class="fa-regular fa-eye"></i>
                      </button>
                    </div>
                    <small class="field-error" id="passwordError"></small>
                  </div>

                  <div class="auth-options">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="rememberMe"
                      />
                      <label class="form-check-label" for="rememberMe">
                        تذكرني
                      </label>
                    </div>

                    <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                  </div>

                  <button type="submit" class="auth-btn" id="loginBtn">
                    <span class="btn-text">
                      <i class="fa-solid fa-arrow-left-to-bracket"></i>
                      تسجيل الدخول
                    </span>
                    <span class="btn-loader d-none">
                      <i class="fa-solid fa-spinner fa-spin"></i>
                      جاري التحقق...
                    </span>
                  </button>

                  <p class="auth-switch">
                    ليس لديك حساب؟
                    <a href="../Register/register.html">إنشاء حساب</a>
                  </p>

                  <div id="loginMessage" class="auth-message"></div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer></footer>

    <script type="module" src="../../shared/js/footer.js"></script>
    <script type="module" src="../../shared/js/navbar.js"></script>
    <script type="module" src="./login.js"></script>
  </body>
</html>
