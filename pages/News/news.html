<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الأخبار</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="./news.css" />
  </head>
  <body>
    <nav></nav>

     <section class="news-hero-section text-center">
  <div class="news-hero-overlay"></div>

  <div class="container">
    <div class="news-hero-content">
      <h1 class="news-hero-title">الأخبار</h1>

      <div class="news-breadcrumb">
        <a href="../../index.html">الرئيسية</a>
        <span class="separator">
          <i class="fa-solid fa-angle-left"></i>
        </span>
        <span>الأخبار</span>
      </div>
    </div>
  </div>
</section>

    <section class="py-5">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="section-title">الخبر المميز</h2>
          <p class="section-subtitle">أبرز أهم تحديث أو خبر لزوار موقعك.</p>
        </div>

        <div id="featuredNewsContainer"></div>
      </div>
    </section>

    <section class="pb-5">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="section-title">أحدث المقالات</h2>
          <p class="section-subtitle">
            اقرأ آخر الأخبار والإعلانات والتحديثات.
          </p>
        </div>

        <div class="row g-4" id="newsContainer"></div>
      </div>
    </section>

    <section class="pb-5">
      <div class="container">
        <div class="newsletter-box">
          <div class="row align-items-center g-4">
            <div class="col-lg-6">
              <h3>اشترك في النشرة البريدية</h3>
              <p>
                احصل على أحدث الأخبار والتحديثات مباشرة في بريدك الإلكتروني.
              </p>
            </div>
            <div class="col-lg-6">
              <form
                class="newsletter-form d-flex flex-column flex-sm-row gap-3"
              >
                <input
                  type="email"
                  class="form-control"
                  placeholder="أدخل بريدك الإلكتروني"
                />
                <button type="submit">اشتراك</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer></footer>

    <script type="module" src="../../shared/js/footer.js"></script>
    <script type="module" src="../../shared/js/navbar.js"></script>
    <script type="module" src="./news.js"></script>
  </body>
</html>
